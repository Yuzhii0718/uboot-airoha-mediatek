name: Airoha Build and Release

# The Airoha boot chain is split over two trees: this repository builds U-Boot
# and packs the FIP images, while BL1/BL2/BL31 are built from the atf-airoha
# tree, checked out as a sibling of the workspace.  airoha.sh drives both and
# stages the bootloader artifacts under tools/build_airoha/source/ before
# tools/build_airoha packs preloader.bin / bl31-uboot.fip.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/ref to build'
        required: true
        default: v2026.10
        type: choice
        options:
          - v2026.10
      atf_ref:
        description: 'Branch/ref of atf-airoha to build the bootloader from'
        required: true
        default: atf-v2.10
        type: string
      SOC:
        description: 'SOC type (e.g., en7523/an7563/an7581/an7583)'
        required: true
        type: string
      BOARD:
        description: 'Board name (e.g., evb)'
        required: true
        type: string
      public_release:
        description: 'Public artifacts'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases in this repository
    steps:
      # 1. Install necessary dependencies for cross-compilation and building
      #    'lzma'/'lzma-dev' is the legacy LZMA SDK encoder: tools/build_airoha
      #    compresses u-boot.bin with it, and with the xz fallback that a
      #    missing package leaves behind, the LZMA-Alone header declares -1
      #    ("unknown size") and BL2 refuses to boot the FIP with
      #    "Failed to decompress image (err=1)".
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential flex bison libssl-dev \
            device-tree-compiler python-is-python3 qemu-user-static \
            lzma lzma-dev unzip xz-utils \
            nodejs npm

      # 2. Show the effective ref/commit this run will use (for diagnostics)
      - name: Show run context
        run: |
          echo "Dropdown ref   = ${{ github.ref }}"
          echo "Dropdown sha   = ${{ github.sha }}"
          echo "Ref name       = ${{ github.ref_name }}"
          echo "Branch input   = ${{ inputs.branch }}"

      # 3. Checkout the repository to access the build scripts and source code.
      #    The `branch` input is required, so the built ref is deterministic.
      #    The `|| github.ref` fallback only matters for future non-dispatch
      #    triggers (e.g. push / pull_request) where `inputs` is unavailable.
      #    IMPORTANT: the "Run workflow" dropdown defaults to the repository
      #    default branch and is independent of the branch shown in the repo
      #    browser; without an explicit `ref` (or branch input) runs silently
      #    build that default branch.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      # 3b. Checkout the ATF bootloader tree and put it where airoha.sh expects
      #     it: as a *sibling* of the U-Boot tree (../atf-airoha).  The action
      #     refuses a path outside the workspace ("Repository path ... is not
      #     under ..."), so it is checked out to ./atf-airoha and moved one level
      #     up afterwards.
      #     This is not cosmetic: the U-Boot tree *is* the workspace, and its
      #     `make clean` deletes every '*.[aios]' file found below the tree, so a
      #     nested ATF tree would have its prebuilt DRAM objects wiped.
      - name: Checkout atf-airoha
        uses: actions/checkout@v4
        with:
          repository: Yuzhii0718/atf-airoha
          ref: ${{ inputs.atf_ref }}
          path: atf-airoha

      - name: Move the ATF tree next to the U-Boot tree
        run: mv "${GITHUB_WORKSPACE}/atf-airoha" "${GITHUB_WORKSPACE}/../atf-airoha"

      # 3c. Cache the ATF host archives: atf-airoha/build.sh fetches the AArch32
      #     toolchain and mbedTLS into dl/ when they are missing (~150 MiB
      #     together), so keep them between runs.  The extracted toolchain is
      #     still unpacked once per run; only the download is avoided.
      - name: Cache the ATF host archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../atf-airoha/dl
          key: atf-airoha-dl-${{ runner.os }}-${{ inputs.atf_ref }}

      # 4. Collect build metadata (U-Boot version, branch, commit hash, build time)
      - name: Generate build info
        run: |
          mkdir -p output_airoha

          # U-Boot version parsed from the top of the Makefile
          UBOOT_VERSION=$(awk -F'= ' '
            /^VERSION =/      {v=$2}
            /^PATCHLEVEL =/   {p=$2}
            /^SUBLEVEL =/     {s=$2}
            /^EXTRAVERSION =/ {e=$2}
            /^NAME =/         {n=$2}
            END {
                ver = v "." p
                if (s != "") ver = ver "." s
                ver = ver e "-" n
                print ver
            }' Makefile)

          # Repository / branch / commit / build time metadata.
          # These are read from the checked-out tree (git rev-parse) so they
          # always reflect what was actually built, regardless of the event.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_SHORT="${COMMIT:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # The ATF tree lives next to the workspace (step 3b) and the bootloader
          # images are built from it, so its commit is recorded as well.
          ATF_DIR="$(cd "${GITHUB_WORKSPACE}/../atf-airoha" && pwd)"
          ATF_BRANCH="$(git -C "${ATF_DIR}" rev-parse --abbrev-ref HEAD)"
          ATF_COMMIT="$(git -C "${ATF_DIR}" rev-parse HEAD)"
          ATF_COMMIT_SHORT="${ATF_COMMIT:0:7}"

          {
            echo "Airoha U-Boot Build Information"
            echo "==============================="
            echo ""
            echo "U-Boot Version : ${UBOOT_VERSION}"
            echo "Repository     : ${GITHUB_REPOSITORY}"
            echo "Branch         : ${BRANCH}"
            echo "Commit         : ${COMMIT_SHORT} (${COMMIT})"
            echo "ATF Repository : Yuzhii0718/atf-airoha"
            echo "ATF Branch     : ${ATF_BRANCH}"
            echo "ATF Commit     : ${ATF_COMMIT_SHORT} (${ATF_COMMIT})"
            echo "Build Time     : ${BUILD_TIME}"
            echo "SOC            : ${{ inputs.SOC }}"
            echo "BOARD          : ${{ inputs.BOARD }}"
          } > output_airoha/build-info.txt
          cat output_airoha/build-info.txt

          # Persist the metadata for later steps (release notes)
          echo "UBOOT_VERSION=${UBOOT_VERSION}"           >> "$GITHUB_ENV"
          echo "BRANCH=${BRANCH}"                         >> "$GITHUB_ENV"
          echo "COMMIT=${COMMIT}"                         >> "$GITHUB_ENV"
          echo "COMMIT_SHORT=${COMMIT_SHORT}"             >> "$GITHUB_ENV"
          echo "ATF_BRANCH=${ATF_BRANCH}"                 >> "$GITHUB_ENV"
          echo "ATF_COMMIT=${ATF_COMMIT}"                 >> "$GITHUB_ENV"
          echo "ATF_COMMIT_SHORT=${ATF_COMMIT_SHORT}"     >> "$GITHUB_ENV"
          echo "BUILD_TIME=${BUILD_TIME}"                 >> "$GITHUB_ENV"

      # 5. Execute the build script with the provided SOC and BOARD inputs,
      #    and capture the full build log into the output directory.  airoha.sh
      #    compiles the bootloader from the ATF tree checked out in step 3b and
      #    stages it under tools/build_airoha/source/ before the FIP images are
      #    packed (the modern blob layout builds from source by default).
      - name: Run build script
        run: |
          set -o pipefail
          chmod +x airoha.sh
          LOG_FILE="output_airoha/build.log"
          ATF_DIR="${GITHUB_WORKSPACE}/../atf-airoha" \
            SOC=${{ inputs.SOC }} BOARD=${{ inputs.BOARD }} ./airoha.sh 2>&1 | tee "${LOG_FILE}"
          cp .config output_airoha/.config

      # 6. Upload the build artifacts (firmware + build-info.txt + build.log)
      #    to the workflow for later use or download
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output_airoha/

      # 7. [Optional] Package the build artifacts into a zip file for release if public_release is true
      - name: Package artifacts for Release
        if: inputs.public_release == true
        run: |
          zip -r artifacts.zip output_airoha/

      - name: Create Release in this repository
        if: inputs.public_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # default token with contents: write permission
        run: |
          # Tag: <UTC date>-<UTC time>-<platform>, e.g. 2026.10.07-1345-airoha:
          # one fixed suffix per workflow, readable from the tag alone and sorted
          # by build order, unlike the run id it replaces.  Which board it was is
          # in the notes below and in the artifact names; no --title, so GitHub
          # names the release after the tag.
          TAG_NAME="$(date -u '+%Y.%m.%d-%H%M')-airoha"

          # Build metadata only; GitHub appends its own "What's Changed" /
          # "New Contributors" sections for the tag (see --generate-notes below).
          cat > RELEASE_NOTES.md <<EOF
          ## Build Information

          - **U-Boot version**: ${UBOOT_VERSION}
          - **Repository**: ${GITHUB_REPOSITORY}
          - **Ref**: \`${{ inputs.branch }}\`
          - **Branch / commit**: ${BRANCH} / \`${COMMIT_SHORT}\`
          - **ATF branch / commit**: ${ATF_BRANCH} / \`${ATF_COMMIT_SHORT}\`
          - **Build time**: ${BUILD_TIME}
          - **SOC / BOARD**: ${{ inputs.SOC }} / ${{ inputs.BOARD }}
          EOF
          cat RELEASE_NOTES.md

          # Create a new release in this repository using the GitHub CLI.  The
          # tag points at the commit that was actually built (the checked-out
          # ref), not at whatever the default branch is at release time, and
          # --generate-notes appends GitHub's own "What's Changed" /
          # "New Contributors" sections below the notes file.
          gh release create "$TAG_NAME" artifacts.zip \
            --repo "${{ github.repository }}" \
            --target "${COMMIT:-${{ github.sha }}}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes \
            --draft=false \
            --prerelease=false
